# Monitoring configuration for Web Attack Situational Awareness System

# Prometheus configuration
prometheus:
  enabled: true
  port: 9090
  scrape_interval: 15s
  targets:
    - backend:8000
    - influxdb:8086

# Grafana configuration
grafana:
  enabled: true
  port: 3000
  default_admin_user: admin
  default_admin_password: admin
  dashboards:
    - name: Web Attack Dashboard
      file: dashboards/web_attack_dashboard.json

# Alertmanager configuration
alertmanager:
  enabled: true
  port: 9093
  route:
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    receiver: 'email'
  receivers:
    - name: 'email'
      email_configs:
        - to: 'admin@example.com'
          send_resolved: true

# Node Exporter configuration
node_exporter:
  enabled: true
  port: 9100
